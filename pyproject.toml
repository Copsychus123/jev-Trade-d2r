[project]
name = "jev-ultrafast"
version = "0.1.0"
description = "A browser agent that chooses instead of generating."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx>=0.28,<1"]

[project.scripts]
jev = "jev_ultrafast.demo:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.tmp-*",
    "/artifacts",
    "/archive",
    "/future/analysis",
    "/future/api-ocr-2025",
    "/future/scripts",
]

[tool.hatch.build.targets.wheel]
packages = ["future/jev_ultrafast"]
sources = ["future"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120
src = ["future"]
exclude = ["archive", "future/analysis", "future/api-ocr-2025", "future/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = [".", "future"]
addopts = ["-m", "not live"]

markers = [
    "live: starts a real Chrome and/or uses the network; excluded from default runs",
]
