<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1010" viewBox="0 0 1580 1010" font-family="Microsoft JhengHei, Noto Sans TC, Arial, sans-serif">
  <rect width="1580" height="1010" fill="#f4f4f4"/>
  <text x="30" y="40" font-size="24" font-weight="bold" fill="#222">Jev Traderie 側邊欄：把「用截圖查名稱」整併進「裝備名稱」（線框圖，僅供確認，尚未實作）</text>
  <text x="30" y="66" font-size="14" fill="#555">原本：獨立的一張「用截圖查名稱」卡片。改成：截圖入口放在裝備名稱欄旁邊，只有放進圖片時才展開辨識區；結果直接填進名稱欄，仍由玩家按「開始查詢」。</text>

  <!-- ============ Frame 1: default ============ -->
  <text x="30" y="104" font-size="16" font-weight="bold" fill="#2563eb">① 平常（沒有截圖）</text>
  <rect x="30" y="116" width="340" height="600" rx="10" fill="#fff" stroke="#999"/>
  <text x="46" y="146" font-size="18" font-weight="bold" fill="#222">Jev Traderie</text>
  <rect x="42" y="158" width="316" height="520" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="54" y="186" font-size="13" font-weight="bold" fill="#333">邀請碼</text>
  <rect x="54" y="194" width="226" height="30" rx="4" fill="#fff" stroke="#999"/><text x="64" y="214" font-size="13" fill="#999">jev-…</text>
  <rect x="288" y="194" width="58" height="30" rx="4" fill="#eee" stroke="#999"/><text x="303" y="214" font-size="13" fill="#333">儲存</text>

  <text x="54" y="252" font-size="13" font-weight="bold" fill="#333">裝備名稱</text>
  <rect x="54" y="260" width="230" height="34" rx="4" fill="#fff" stroke="#999"/><text x="64" y="282" font-size="14" fill="#222">Harlequin Crest</text>
  <rect x="292" y="260" width="54" height="34" rx="4" fill="#eef4ff" stroke="#2563eb"/>
  <text x="319" y="275" font-size="14" text-anchor="middle" fill="#2563eb">📷</text>
  <text x="319" y="289" font-size="10" text-anchor="middle" fill="#2563eb">截圖</text>
  <text x="54" y="306" font-size="11" fill="#777">可直接輸入名稱；或按「截圖」選圖，</text>
  <text x="54" y="320" font-size="11" fill="#777">或在此按 Ctrl+V 貼圖、把圖拖進來</text>

  <text x="54" y="344" font-size="13" font-weight="bold" fill="#333">載入更多次數</text>
  <rect x="54" y="352" width="292" height="30" rx="4" fill="#fff" stroke="#999"/><text x="64" y="372" font-size="13" fill="#222">0</text><text x="330" y="372" font-size="11" fill="#666">▼</text>
  <rect x="54" y="396" width="226" height="36" rx="4" fill="#2563eb"/><text x="167" y="419" font-size="14" text-anchor="middle" fill="#fff">開始查詢</text>
  <rect x="288" y="396" width="58" height="36" rx="4" fill="#eee" stroke="#bbb"/><text x="317" y="419" font-size="14" text-anchor="middle" fill="#aaa">停止</text>
  <text x="54" y="460" font-size="12" fill="#666">今日已用 0/100 次</text>
  <text x="54" y="492" font-size="13" font-weight="bold" fill="#333">進度</text>
  <text x="54" y="515" font-size="12" fill="#999">（查詢後在這裡顯示步驟）</text>
  <text x="54" y="560" font-size="13" font-weight="bold" fill="#333">目前掛單 ／ 近期成交 ／ 檢查結果 …</text>

  <!-- ============ Frame 2: image loaded ============ -->
  <text x="400" y="104" font-size="16" font-weight="bold" fill="#2563eb">② 放進截圖後：名稱欄下方展開辨識區</text>
  <rect x="400" y="116" width="340" height="780" rx="10" fill="#fff" stroke="#999"/>
  <text x="416" y="146" font-size="18" font-weight="bold" fill="#222">Jev Traderie</text>
  <rect x="412" y="158" width="316" height="720" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="424" y="186" font-size="13" font-weight="bold" fill="#333">邀請碼</text>
  <rect x="424" y="194" width="226" height="30" rx="4" fill="#fff" stroke="#999"/><text x="434" y="214" font-size="13" fill="#999">••••••••</text>
  <rect x="658" y="194" width="58" height="30" rx="4" fill="#eee" stroke="#999"/><text x="673" y="214" font-size="13" fill="#333">儲存</text>

  <text x="424" y="252" font-size="13" font-weight="bold" fill="#333">裝備名稱</text>
  <rect x="424" y="260" width="230" height="34" rx="4" fill="#fff" stroke="#999"/><text x="434" y="282" font-size="14" fill="#222">Harlequin Crest</text>
  <rect x="662" y="260" width="54" height="34" rx="4" fill="#2563eb" stroke="#2563eb"/><text x="689" y="275" font-size="14" text-anchor="middle" fill="#fff">📷</text><text x="689" y="289" font-size="10" text-anchor="middle" fill="#fff">截圖</text>

  <rect x="424" y="304" width="292" height="332" rx="6" fill="#f8fbff" stroke="#2563eb" stroke-dasharray="6 4"/>
  <text x="436" y="326" font-size="13" font-weight="bold" fill="#2563eb">截圖辨識</text>
  <text x="706" y="326" font-size="13" text-anchor="end" fill="#666">✕ 收起</text>
  <text x="436" y="350" font-size="12" fill="#333">截圖上的遊戲語言</text>
  <rect x="436" y="356" width="268" height="28" rx="4" fill="#fff" stroke="#999"/><text x="446" y="375" font-size="12" fill="#222">繁體中文（已存在本機，可離線）</text><text x="690" y="375" font-size="11" fill="#666">▼</text>
  <rect x="436" y="394" width="268" height="150" rx="4" fill="#2b2b36" stroke="#888"/>
  <text x="570" y="428" font-size="12" text-anchor="middle" fill="#ddd">（截圖預覽）</text>
  <rect x="470" y="440" width="190" height="64" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
  <text x="565" y="476" font-size="11" text-anchor="middle" fill="#bcd">拖一個框，只讀框裡的字（選填）</text>
  <rect x="436" y="556" width="130" height="32" rx="4" fill="#2563eb"/><text x="501" y="577" font-size="14" text-anchor="middle" fill="#fff">辨識</text>
  <rect x="574" y="556" width="130" height="32" rx="4" fill="#eee" stroke="#aaa"/><text x="639" y="577" font-size="13" text-anchor="middle" fill="#333">換一張／移除</text>
  <text x="436" y="610" font-size="11" fill="#666">已讀入圖片。可在圖上拖框，再按「辨識」。</text>

  <rect x="424" y="650" width="226" height="36" rx="4" fill="#2563eb" fill-opacity="0.45"/><text x="537" y="673" font-size="14" text-anchor="middle" fill="#fff">開始查詢</text>
  <text x="424" y="706" font-size="12" fill="#666">（辨識前不會自動填入、也不會查詢）</text>

  <!-- ============ Frame 3: first-use download ============ -->
  <text x="770" y="104" font-size="16" font-weight="bold" fill="#2563eb">③ 第一次用某個語言：先問、再下載</text>
  <rect x="770" y="116" width="340" height="780" rx="10" fill="#fff" stroke="#999"/>
  <text x="786" y="146" font-size="18" font-weight="bold" fill="#222">Jev Traderie</text>
  <rect x="782" y="158" width="316" height="720" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="794" y="252" font-size="13" font-weight="bold" fill="#333">裝備名稱</text>
  <rect x="794" y="260" width="230" height="34" rx="4" fill="#fff" stroke="#999"/><text x="804" y="282" font-size="14" fill="#222">Harlequin Crest</text>
  <rect x="1032" y="260" width="54" height="34" rx="4" fill="#2563eb"/><text x="1059" y="275" font-size="14" text-anchor="middle" fill="#fff">📷</text><text x="1059" y="289" font-size="10" text-anchor="middle" fill="#fff">截圖</text>
  <rect x="794" y="304" width="292" height="360" rx="6" fill="#f8fbff" stroke="#2563eb" stroke-dasharray="6 4"/>
  <text x="806" y="326" font-size="13" font-weight="bold" fill="#2563eb">截圖辨識</text>
  <rect x="806" y="340" width="268" height="28" rx="4" fill="#fff" stroke="#999"/><text x="816" y="359" font-size="12" fill="#222">日本語 日文</text><text x="1060" y="359" font-size="11" fill="#666">▼</text>
  <rect x="806" y="378" width="268" height="70" rx="4" fill="#2b2b36" stroke="#888"/><text x="940" y="418" font-size="12" text-anchor="middle" fill="#ddd">（截圖預覽，縮小顯示）</text>
  <rect x="806" y="460" width="268" height="104" rx="4" fill="#fff8e1" stroke="#f59e0b"/>
  <text x="816" y="482" font-size="12" fill="#333">首次使用「日本語」需下載辨識模型</text>
  <text x="816" y="500" font-size="12" fill="#333">（約 2.0 MB，只下載一次，存在這個瀏覽器，</text>
  <text x="816" y="518" font-size="12" fill="#333">之後可離線使用）。</text>
  <rect x="816" y="528" width="112" height="28" rx="4" fill="#2563eb"/><text x="872" y="547" font-size="12" text-anchor="middle" fill="#fff">同意並下載</text>
  <rect x="936" y="528" width="80" height="28" rx="4" fill="#eee" stroke="#aaa"/><text x="976" y="547" font-size="12" text-anchor="middle" fill="#333">不下載</text>
  <text x="806" y="590" font-size="12" fill="#333">下載辨識模型「日本語」：1.3 / 2.0 MB</text>
  <rect x="806" y="598" width="268" height="10" rx="5" fill="#ddd"/><rect x="806" y="598" width="174" height="10" rx="5" fill="#2563eb"/>
  <text x="806" y="636" font-size="11" fill="#666">失敗會顯示原因，不會自動重試。</text>
  <text x="806" y="652" font-size="11" fill="#2563eb">▸ 下載不了？手動匯入模型（檢查碼不符會被拒絕）</text>

  <!-- ============ Frame 4: result ============ -->
  <text x="1140" y="104" font-size="16" font-weight="bold" fill="#2563eb">④ 辨識完成：名稱直接填入，玩家決定查不查</text>
  <rect x="1140" y="116" width="340" height="780" rx="10" fill="#fff" stroke="#999"/>
  <text x="1156" y="146" font-size="18" font-weight="bold" fill="#222">Jev Traderie</text>
  <rect x="1152" y="158" width="316" height="720" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="1164" y="252" font-size="13" font-weight="bold" fill="#333">裝備名稱</text>
  <rect x="1164" y="260" width="230" height="34" rx="4" fill="#fffbe0" stroke="#f59e0b" stroke-width="2"/><text x="1174" y="282" font-size="14" fill="#222">Mara's Kaleidoscope</text>
  <rect x="1402" y="260" width="54" height="34" rx="4" fill="#2563eb"/><text x="1429" y="275" font-size="14" text-anchor="middle" fill="#fff">📷</text><text x="1429" y="289" font-size="10" text-anchor="middle" fill="#fff">截圖</text>
  <rect x="1164" y="298" width="96" height="18" rx="9" fill="#fde68a"/><text x="1212" y="311" font-size="10" text-anchor="middle" fill="#92400e">來自截圖，請確認</text>

  <rect x="1164" y="326" width="292" height="248" rx="6" fill="#f8fbff" stroke="#2563eb" stroke-dasharray="6 4"/>
  <text x="1176" y="348" font-size="13" font-weight="bold" fill="#2563eb">截圖辨識</text>
  <rect x="1176" y="358" width="268" height="62" rx="4" fill="#2b2b36" stroke="#888"/><text x="1310" y="394" font-size="12" text-anchor="middle" fill="#ddd">（截圖縮圖）</text>
  <text x="1176" y="442" font-size="12" fill="#16a34a">已辨識，並填入裝備名稱「Mara's Kaleidoscope」。</text>
  <text x="1176" y="458" font-size="12" fill="#16a34a">請確認後自己按「開始查詢」。</text>
  <text x="1176" y="480" font-size="11" fill="#666">不對的話，改點其他名稱：</text>
  <rect x="1176" y="488" width="150" height="26" rx="13" fill="#fff" stroke="#2563eb"/><text x="1251" y="506" font-size="11" text-anchor="middle" fill="#2563eb">Mara's Kaleidoscope</text>
  <rect x="1334" y="488" width="110" height="26" rx="13" fill="#fff" stroke="#999"/><text x="1389" y="506" font-size="11" text-anchor="middle" fill="#333">Maras Gaze</text>
  <text x="1176" y="540" font-size="11" fill="#2563eb">▸ 看辨識出的文字　　辨識用時 2.1 秒</text>
  <text x="1176" y="560" font-size="11" fill="#b45309">只認出底材時會寫：「只認出底材（不會依品質篩選）」</text>

  <rect x="1164" y="592" width="226" height="40" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/><text x="1277" y="618" font-size="15" text-anchor="middle" fill="#fff">開始查詢</text>
  <text x="1164" y="654" font-size="12" fill="#666">辨識不到時：名稱欄維持原樣，</text>
  <text x="1164" y="672" font-size="12" fill="#666">顯示「認不出，請手動輸入」。</text>
  <text x="1164" y="700" font-size="11" fill="#999">（邀請碼等其他欄位在 ③④ 省略不畫）</text>

  <!-- ============ Notes ============ -->
  <rect x="30" y="920" width="1450" height="70" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="46" y="946" font-size="13" font-weight="bold" fill="#333">這份線框圖的重點</text>
  <text x="46" y="966" font-size="12" fill="#444">1. 少一張獨立卡片：入口是名稱欄旁的「📷 截圖」，也可在側邊欄任何地方 Ctrl+V 貼圖或把圖拖進名稱區。　2. 辨識區只在有圖片時展開，可收起。</text>
  <text x="46" y="984" font-size="12" fill="#444">3. 行為不變：辨識結果只填名稱欄、不自動查詢；語言選單、首次下載詢問、手動匯入模型、看辨識出的文字都保留，只是搬進這個展開區。</text>
</svg>
